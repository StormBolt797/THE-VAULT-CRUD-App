{% extends "index.html" %}
{% block title %}Upload File{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm">
            <div class="card-header">
                <i class="fas fa-upload mr-2"></i>Upload File to Vault
            </div>
            <div class="card-body">
                <p class="text-muted small mb-4">
                    Files are read as binary and stored directly into your encrypted cloud database row.
                </p>
                <form method="POST" action="/fileupload" enctype="multipart/form-data">
                    <div class="form-group mb-4">
                        <label class="text-muted small text-uppercase">Choose File</label>
                        <input type="file" name="file" class="form-control" required style="padding: 0.35rem 0.5rem;">
                    </div>
                    <div class="d-flex justify-content-between align-items-center">
                        <a href="/" class="btn btn-outline-secondary">Cancel</a>
                        <button type="submit" class="btn btn-primary px-4"><i class="fas fa-arrow-up mr-1"></i> Upload</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

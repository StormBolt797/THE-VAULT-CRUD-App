{% extends "index.html" %}
{% block title %}Notes - The Vault{% endblock %}
{% block content %}
<div class="row justify-content-center mt-3">
    <div class="col-md-8">
        <div class="card shadow-sm">
            <div class="card-header d-flex justify-content-between align-items-center py-3">
                <span style="font-weight: 700;"><i class="fas fa-sticky-note mr-2" style="color: var(--accent-green);"></i>Personal Notes</span>
                <span class="badge" style="background-color: #1a1e24; color: var(--accent-green); border: 1px solid var(--border-color); font-weight: 600;">Timestamped</span>
            </div>
            <div class="card-body p-4">
                <p class="text-muted small mb-3">
                    Each note is automatically stamped with the date & time and appended to your personal text file in the database.
                </p>
                <form method="POST">
                    <div class="form-group">
                        <label for="note" class="text-muted small text-uppercase" style="font-weight: 600; letter-spacing: 0.5px;">Write note</label>
                        <textarea class="form-control" name="note" id="note" rows="7" placeholder="Type your note here..." required></textarea>
                    </div>
                    <div class="d-flex justify-content-between align-items-center mt-4">
                        <a href="/" class="btn btn-outline-secondary">Back to Vaultbox</a>
                        <button type="submit" class="btn btn-primary px-4"><i class="fas fa-save mr-1"></i> Save Note</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

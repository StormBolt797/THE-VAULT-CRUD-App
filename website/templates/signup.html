{% extends "index.html" %}
{% block title %}Sign Up - The Vault{% endblock %}
{% block content %}
<div class="row justify-content-center mt-3">
    <div class="col-md-5">
        <div class="card shadow-sm">
            <div class="card-header text-center py-3">
                <h4 class="mb-0" style="font-weight: 700;">Create Vault Account</h4>
                <p class="text-muted small mb-0 mt-1">Get your private encrypted storage</p>
            </div>
            <div class="card-body p-4">
                <form method="POST">
                    <div class="form-group mb-3">
                        <label for="email" class="text-muted small text-uppercase">Email Address</label>
                        <input
                            type="email"
                            class="form-control"
                            id="email"
                            name="email"
                            placeholder="name@example.com"
                            required
                        />
                    </div>
                    <div class="form-group mb-3">
                        <label for="firstName" class="text-muted small text-uppercase">First Name</label>
                        <input
                            type="text"
                            class="form-control"
                            id="firstName"
                            name="firstName"
                            placeholder="Your first name"
                            required
                        />
                    </div>
                    <div class="form-group mb-3">
                        <label for="password1" class="text-muted small text-uppercase">Password</label>
                        <input
                            type="password"
                            class="form-control"
                            id="password1"
                            name="password1"
                            placeholder="Choose a strong password"
                            required
                        />
                    </div>
                    <div class="form-group mb-4">
                        <label for="phoneno" class="text-muted small text-uppercase">Phone Number (10 Digits)</label>
                        <input
                            type="text"
                            class="form-control"
                            id="phoneno"
                            name="phoneno"
                            placeholder="10-digit mobile number"
                            required
                        />
                    </div>
                    <button type="submit" class="btn btn-primary btn-block py-2">Create Account</button>
                </form>
                <div class="text-center mt-4">
                    <span class="text-muted small">Already have an account? </span>
                    <a href="/login" style="color: #58a6ff; font-weight: 500;">Sign in</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

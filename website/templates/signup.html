{% extends "index.html" %}
{% block title %}Sign Up - The Vault{% endblock %}
{% block content %}
<div class="row justify-content-center mt-4">
    <div class="col-md-5">
        <div class="card shadow-sm">
            <div class="card-header text-center py-4">
                <i class="fas fa-user-plus mb-2" style="font-size: 1.8rem; color: var(--accent-green);"></i>
                <h4 class="mb-0" style="font-weight: 800; letter-spacing: -0.5px;">Create Your Account</h4>
                <p class="text-muted small mb-0 mt-1">Get your private encrypted vaultbox</p>
            </div>
            <div class="card-body p-4">
                <form method="POST">
                    <div class="form-group mb-3">
                        <label for="email" class="text-muted small text-uppercase" style="font-weight: 600; letter-spacing: 0.5px;">Email Address</label>
                        <input
                            type="email"
                            class="form-control"
                            id="email"
                            name="email"
                            placeholder="name@example.com"
                            required
                        />
                    </div>
                    <div class="form-group mb-3">
                        <label for="firstName" class="text-muted small text-uppercase" style="font-weight: 600; letter-spacing: 0.5px;">First Name</label>
                        <input
                            type="text"
                            class="form-control"
                            id="firstName"
                            name="firstName"
                            placeholder="Your name"
                            required
                        />
                    </div>
                    <div class="form-group mb-3">
                        <label for="password1" class="text-muted small text-uppercase" style="font-weight: 600; letter-spacing: 0.5px;">Password</label>
                        <input
                            type="password"
                            class="form-control"
                            id="password1"
                            name="password1"
                            placeholder="Choose a password"
                            required
                        />
                    </div>
                    <div class="form-group mb-4">
                        <label for="phoneno" class="text-muted small text-uppercase" style="font-weight: 600; letter-spacing: 0.5px;">Phone Number (10 Digits)</label>
                        <input
                            type="text"
                            class="form-control"
                            id="phoneno"
                            name="phoneno"
                            placeholder="10-digit mobile number"
                            required
                        />
                    </div>
                    <button type="submit" class="btn btn-primary btn-block py-2 mb-3">Create Account</button>
                </form>
                <div class="text-center mt-3 pt-3" style="border-top: 1px solid var(--border-color);">
                    <span class="text-muted small">Already registered? </span>
                    <a href="/login" style="color: var(--accent-green); font-weight: 600;">Sign in</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
